[package]
name = "rchat-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# file_check.rs and media_check.rs use std only and are compiled by path
# (plan Decision 16): fuzzing never builds the core or BoringSSL.
[[bin]]
name = "file_check"
path = "fuzz_targets/file_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media_check"
path = "fuzz_targets/media_check.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
