name: clippy (advisory)

# Advisory clippy for the client library (rchat/shared/rchat-core). NOT a PR gate:
# the public baseline is not clippy-clean on today's stable toolchain (deprecated
# Atomic::fetch_update, chunks_exact-with-constant-size, a needless range loop,
# Result::unwrap_or simplification, and dead JNI constants in the non-Android test
# build). It runs nightly + on demand so the lint debt stays visible without
# blocking merges. Once the baseline is cleaned, move clippy into build.yml as a
# required PR check (cargo clippy --all-targets -- -D warnings) and delete this file.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    continue-on-error: true
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rchat/shared/rchat-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: core clippy (advisory)
        run: cargo clippy --all-targets -- -D warnings